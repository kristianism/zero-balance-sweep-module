[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 1_000_000
via_ir = false
evm_version = "shanghai"
bytecode_hash = "none"
cbor_metadata = false

# Mainnet fork tests use real Aave V3 liquidity. Pin a recent block in CI for
# deterministic gas/yield numbers; leave unpinned locally for flexibility.
fs_permissions = [{ access = "read", path = "./" }]

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"

[rpc_endpoints]
mainnet = "${MAINNET_RPC_URL}"
base    = "${BASE_RPC_URL}"
